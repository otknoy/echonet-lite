name: Release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and source commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Expected a stable version tag such as v0.0.4' >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main
  checks:
    name: Release checks
    needs: validate
    uses: ./.github/workflows/ci.yml
  publish:
    name: Publish Linux binaries
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - name: Build release archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            name="echonet_${RELEASE_TAG}_linux_${arch}"
            mkdir -p "dist/$name"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -o "dist/$name/echonet" ./cmd/echonet
            cp LICENSE README.md config.example.yaml "dist/$name/"
            tar -C "dist/$name" -czf "dist/$name.tar.gz" .
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/checksums.txt \
            --verify-tag --generate-notes --title "$RELEASE_TAG" --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest
